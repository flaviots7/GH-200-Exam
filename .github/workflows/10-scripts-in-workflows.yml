# Domain 1: Author and maintain workflows (40%)
# Topic: Create a workflow for a particular purpose - Add a script to a workflow

name: 10 - Scripts in Workflows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  inline-scripts:
    name: Inline Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Simple bash script
        run: |
          echo "Running inline bash script"
          for i in {1..5}; do
            echo "Iteration $i"
          done
          
      - name: Python script inline
        shell: python
        run: |
          import os
          import datetime
          
          print("Python script in workflow")
          print(f"Current time: {datetime.datetime.now()}")
          print(f"Working directory: {os.getcwd()}")
          
          # Create a file
          with open('python-output.txt', 'w') as f:
              f.write('Generated by Python script\n')
          
      - name: PowerShell script inline
        shell: pwsh
        run: |
          Write-Host "PowerShell script in workflow"
          $date = Get-Date
          Write-Host "Current date: $date"
          
          # Create an object
          $info = @{
              Workflow = "${{ github.workflow }}"
              RunNumber = "${{ github.run_number }}"
              Repository = "${{ github.repository }}"
          }
          $info | ConvertTo-Json
          
      - name: Node.js script inline
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run Node.js inline
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const data = {
              workflow: process.env.GITHUB_WORKFLOW,
              runId: process.env.GITHUB_RUN_ID,
              timestamp: new Date().toISOString()
            };
            console.log('Node.js script output:');
            console.log(JSON.stringify(data, null, 2));
          "

  external-scripts:
    name: External Script Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh
          
      - name: Run external bash script
        run: ./scripts/build.sh
        
      - name: Run external Python script
        run: python scripts/analyze.py
        
      - name: Run script with parameters
        run: ./scripts/deploy.sh staging v1.0.0
        env:
          DEPLOY_ENV: staging
          VERSION: v1.0.0

  scripts-with-outputs:
    name: Scripts with Outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Script that generates output
        id: generate
        run: |
          # Generate some data
          VERSION="2.5.${{ github.run_number }}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          
          # Set outputs
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          
          # Also set environment variable
          echo "BUILD_VERSION=$VERSION" >> $GITHUB_ENV
          
      - name: Use script outputs
        run: |
          echo "Version from output: ${{ steps.generate.outputs.version }}"
          echo "Timestamp from output: ${{ steps.generate.outputs.timestamp }}"
          echo "Version from env: $BUILD_VERSION"

  error-handling:
    name: Script Error Handling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Script with error handling
        run: |
          set -e  # Exit on error
          
          echo "Starting process..."
          
          # Function for error handling
          handle_error() {
            echo "Error occurred in script"
            exit 1
          }
          
          # Trap errors
          trap 'handle_error' ERR
          
          # Your commands here
          echo "Step 1: Preparing..."
          echo "Step 2: Processing..."
          echo "Step 3: Complete!"
          
      - name: Script with continue on error
        continue-on-error: true
        run: |
          echo "This might fail..."
          exit 1
          
      - name: Check previous step
        if: always()
        run: |
          echo "Previous step status: ${{ steps.*.outcome }}"
          echo "Continuing workflow..."

  complex-script-example:
    name: Complex Script Example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Multi-step build script
        run: |
          #!/bin/bash
          set -euo pipefail
          
          # Colors for output
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          NC='\033[0m' # No Color
          
          log_info() {
            echo -e "${GREEN}[INFO]${NC} $1"
          }
          
          log_warn() {
            echo -e "${YELLOW}[WARN]${NC} $1"
          }
          
          log_error() {
            echo -e "${RED}[ERROR]${NC} $1"
          }
          
          log_info "Starting build process..."
          
          # Check prerequisites
          log_info "Checking prerequisites..."
          command -v node >/dev/null 2>&1 || log_warn "Node.js not found"
          
          # Create directories
          log_info "Creating build directories..."
          mkdir -p build/dist
          mkdir -p build/reports
          
          # Simulate build steps
          log_info "Compiling source code..."
          sleep 1
          
          log_info "Running tests..."
          sleep 1
          
          log_info "Generating documentation..."
          sleep 1
          
          log_info "Build completed successfully!"
          
          # Create build manifest
          cat > build/manifest.json <<EOF
          {
            "version": "1.0.${{ github.run_number }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "runner": "${{ runner.os }}"
          }
          EOF
          
          log_info "Build manifest created"
          cat build/manifest.json

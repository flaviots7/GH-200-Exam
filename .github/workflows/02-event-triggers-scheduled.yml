# Domain 1: Author and maintain workflows (40%)
# Topic: Work with events that trigger workflows - Configure workflows to run for scheduled events

name: 02 - Event Triggers - Scheduled (Cron)

# Schedule workflow to run at specific times using cron syntax
on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
    # Runs at 12:00 UTC on Mondays
    - cron: '0 12 * * 1'
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  # Also allow manual trigger for testing
  workflow_dispatch:

jobs:
  scheduled-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Display schedule information
        run: |
          echo "This workflow runs on a schedule"
          echo "Current time: $(date)"
          echo "Event name: ${{ github.event_name }}"
          
      - name: Perform scheduled maintenance
        run: |
          echo "Running scheduled maintenance tasks..."
          echo "- Checking for updates"
          echo "- Cleaning up old artifacts"
          echo "- Generating reports"
          
      - name: Create artifact with timestamp
        run: |
          mkdir -p reports
          echo "Report generated at $(date)" > reports/schedule-report.txt
          echo "Event: ${{ github.event_name }}" >> reports/schedule-report.txt
          
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: schedule-report-${{ github.run_number }}
          path: reports/schedule-report.txt

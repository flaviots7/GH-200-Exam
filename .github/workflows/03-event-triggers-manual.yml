# Domain 1: Author and maintain workflows (40%)
# Topic: Work with events that trigger workflows - Configure workflows to run for manual events

name: 03 - Event Triggers - Manual (workflow_dispatch)

# Manual workflow with input parameters
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
          - test
        default: 'development'
      log-level:
        description: 'Log level'
        required: true
        type: choice
        options:
          - debug
          - info
          - warning
          - error
        default: 'info'
      perform-deployment:
        description: 'Actually perform deployment'
        required: true
        type: boolean
        default: false
      custom-tag:
        description: 'Custom tag for this run'
        required: false
        type: string

jobs:
  manual-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Display input parameters
        run: |
          echo "Manual workflow triggered!"
          echo "Environment: ${{ inputs.environment }}"
          echo "Log Level: ${{ inputs.log-level }}"
          echo "Perform Deployment: ${{ inputs.perform-deployment }}"
          echo "Custom Tag: ${{ inputs.custom-tag }}"
          echo "Triggered by: ${{ github.actor }}"
          
      - name: Validate environment
        run: |
          if [ "${{ inputs.environment }}" == "production" ]; then
            echo "⚠️ Production environment selected - extra validation required"
          fi
          
      - name: Simulate deployment
        if: inputs.perform-deployment == true
        run: |
          echo "🚀 Deploying to ${{ inputs.environment }}..."
          echo "Using log level: ${{ inputs.log-level }}"
          sleep 2
          echo "✅ Deployment completed successfully!"
          
      - name: Skip deployment
        if: inputs.perform-deployment == false
        run: |
          echo "⏭️ Deployment skipped (dry-run mode)"
          echo "Would deploy to: ${{ inputs.environment }}"

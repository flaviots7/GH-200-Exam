# Domain 3: Author and maintain actions (25%)
# Topic: Using different action types

name: 21 - Using Custom Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  use-javascript-action:
    name: Use JavaScript Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js (required for JavaScript actions)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install action dependencies
        working-directory: .github/actions/javascript-action
        run: npm install
        
      - name: Use JavaScript action
        id: js-action
        uses: ./.github/actions/javascript-action
        with:
          who-to-greet: 'GitHub Actions Developer'
          greeting: 'Welcome'
          loudly: 'false'
          
      - name: Display action outputs
        run: |
          echo "Time: ${{ steps.js-action.outputs.time }}"
          echo "Message: ${{ steps.js-action.outputs.message }}"
          echo "Environment variable: $GREETING_MESSAGE"
          
      - name: Use JavaScript action with different inputs
        id: js-action-loud
        uses: ./.github/actions/javascript-action
        with:
          who-to-greet: 'World'
          greeting: 'Hello'
          loudly: 'true'
          
      - name: Display loud greeting
        run: echo "${{ steps.js-action-loud.outputs.message }}"

  use-docker-action:
    name: Use Docker Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Docker action for analysis
        id: analyze
        uses: ./.github/actions/docker-action
        with:
          task: 'analyze'
          target: '.'
          verbose: 'true'
          
      - name: Display analysis results
        run: |
          echo "Result: ${{ steps.analyze.outputs.result }}"
          echo "Exit code: ${{ steps.analyze.outputs.exit-code }}"
          
      - name: Use Docker action for build
        id: build
        uses: ./.github/actions/docker-action
        with:
          task: 'build'
          target: './src'
          verbose: 'false'
          
      - name: Display build results
        run: echo "${{ steps.build.outputs.result }}"
        
      - name: Use Docker action for testing
        id: test
        uses: ./.github/actions/docker-action
        with:
          task: 'test'
          target: './tests'
          verbose: 'true'

  use-composite-action:
    name: Use Composite Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create package.json for testing
        run: |
          cat > package.json <<EOF
          {
            "name": "test-app",
            "version": "1.0.0",
            "scripts": {
              "test": "echo 'Running tests...'"
            }
          }
          EOF
          
      - name: Setup Node.js environment using composite action
        id: node-setup
        uses: ./.github/actions/composite-action
        with:
          language: 'node'
          version: '20'
          install-dependencies: 'true'
          run-tests: 'false'
          
      - name: Display setup results
        run: |
          echo "Setup time: ${{ steps.node-setup.outputs.setup-time }}"
          echo "Status: ${{ steps.node-setup.outputs.status }}"
          
      - name: Setup Python environment using composite action
        id: python-setup
        uses: ./.github/actions/composite-action
        with:
          language: 'python'
          version: '3.11'
          install-dependencies: 'false'
          run-tests: 'false'

  compare-action-types:
    name: Compare Action Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Action types comparison
        run: |
          cat <<'EOF'
          === GitHub Actions Type Comparison ===
          
          1. JavaScript Actions
          ✓ Pros:
            - Fast execution (no container build)
            - Access to GitHub Actions toolkit
            - Works on all runners (Linux, Windows, macOS)
            - Can use npm packages
            - Direct runner access
          
          ✗ Cons:
            - Requires Node.js knowledge
            - Must manage dependencies
            - Limited to JavaScript/TypeScript
            - Dependencies must be committed or bundled
          
          Best for:
            - Quick operations
            - GitHub API interactions
            - Cross-platform tools
            - Actions requiring speed
          
          2. Docker Container Actions
          ✓ Pros:
            - Complete environment control
            - Use any language/toolset
            - Consistent execution
            - Isolated from runner
            - Can install system dependencies
          
          ✗ Cons:
            - Slower startup (image build/pull)
            - Linux runners only
            - Larger size
            - More complex setup
            - Docker knowledge required
          
          Best for:
            - Complex toolchains
            - Specific OS requirements
            - Specialized tools
            - Multi-language workflows
          
          3. Composite Actions
          ✓ Pros:
            - Pure YAML (no coding)
            - Combine existing actions
            - Fast (no build step)
            - Works on all runners
            - Easy to create and maintain
          
          ✗ Cons:
            - Limited flexibility
            - Can't use complex logic
            - Depends on other actions
            - No programming capabilities
          
          Best for:
            - Reusing step sequences
            - Standardizing workflows
            - Combining existing actions
            - Simple automation patterns
          
          === Decision Guide ===
          
          Use JavaScript Action when:
          - You need fast execution
          - Working with GitHub API
          - Need to run on all platforms
          - Have JavaScript skills
          
          Use Docker Action when:
          - Need specific environment
          - Using specialized tools
          - Require system dependencies
          - Language flexibility needed
          
          Use Composite Action when:
          - Reusing workflow patterns
          - Combining existing actions
          - No custom coding needed
          - Want simplicity
          EOF

  troubleshoot-actions:
    name: Troubleshooting Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Troubleshooting guide
        run: |
          cat <<'EOF'
          === Troubleshooting GitHub Actions ===
          
          JavaScript Actions:
          
          1. Action not found
            - Check action.yml exists
            - Verify action.yml syntax
            - Ensure path is correct
          
          2. Dependencies missing
            - Run: npm install
            - Commit node_modules OR
            - Bundle with @vercel/ncc
          
          3. Module not found
            - Check package.json
            - Verify import statements
            - Check Node version compatibility
          
          4. Debugging
            - Add console.log() statements
            - Use core.debug()
            - Enable ACTIONS_STEP_DEBUG
            - Check action logs
          
          Docker Actions:
          
          1. Image build fails
            - Check Dockerfile syntax
            - Verify base image exists
            - Check network connectivity
          
          2. Entrypoint errors
            - Verify file permissions (chmod +x)
            - Check line endings (use LF, not CRLF)
            - Validate shebang (#!/bin/bash)
          
          3. Inputs not received
            - Check action.yml args mapping
            - Verify entrypoint parameters
            - Test locally with docker run
          
          4. Debugging
            - Add echo statements in entrypoint
            - Check container logs
            - Test locally: docker build && docker run
            - Use docker exec for live debugging
          
          Composite Actions:
          
          1. Step fails
            - Check shell is specified
            - Verify syntax in YAML
            - Test individual steps
          
          2. Outputs not working
            - Set output: echo "name=value" >> $GITHUB_OUTPUT
            - Define in outputs section
            - Reference with steps.id.outputs.name
          
          3. Action not found
            - Verify path is correct
            - Check action.yml exists
            - Ensure using 'composite' in runs.using
          
          4. Debugging
            - Add echo/debug statements
            - Test steps individually
            - Check conditionals (if:)
            - Verify input references
          EOF

# Domain 2: Consume workflows (20%)
# Topic: Workflow artifacts, status badges, and environments

name: 17 - Artifacts and Status Badges

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  create-artifacts:
    name: Create and Upload Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create build artifacts
        run: |
          mkdir -p artifacts/logs
          mkdir -p artifacts/reports
          mkdir -p artifacts/binaries
          
          # Create log files
          echo "Build log for run #${{ github.run_number }}" > artifacts/logs/build.log
          echo "Started at: $(date)" >> artifacts/logs/build.log
          echo "Commit: ${{ github.sha }}" >> artifacts/logs/build.log
          
          # Create test reports
          cat > artifacts/reports/test-report.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites tests="10" failures="0" errors="0">
            <testsuite name="Unit Tests" tests="10" failures="0">
              <testcase name="test1" time="0.001"/>
              <testcase name="test2" time="0.002"/>
            </testsuite>
          </testsuites>
          EOF
          
          # Create coverage report
          cat > artifacts/reports/coverage.txt <<EOF
          Coverage Summary
          ================
          Lines: 95%
          Branches: 88%
          Functions: 100%
          Statements: 95%
          EOF
          
          # Create mock binary
          echo "Mock binary v${{ github.run_number }}" > artifacts/binaries/app
          
      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
          
      - name: Upload logs separately
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: artifacts/logs/
          retention-days: 7
          
      - name: Upload reports separately
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: artifacts/reports/
          retention-days: 14
          
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: application-binary
          path: artifacts/binaries/app
          retention-days: 90

  download-and-process-artifacts:
    name: Download and Process Artifacts
    needs: create-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded Artifacts ==="
          find . -type f -name "*"
          
      - name: Download specific artifact
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: ./reports
          
      - name: Process test reports
        run: |
          echo "=== Test Reports ==="
          cat ./reports/test-report.xml
          echo ""
          echo "=== Coverage Report ==="
          cat ./reports/coverage.txt

  artifact-management:
    name: Artifact Management Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Artifact best practices
        run: |
          echo "=== Artifact Best Practices ==="
          echo ""
          echo "1. Naming conventions:"
          echo "   - Use descriptive names"
          echo "   - Include version/run number"
          echo "   - Example: build-v1.0.0-ubuntu"
          echo ""
          echo "2. Retention periods:"
          echo "   - Logs: 7-14 days"
          echo "   - Test reports: 14-30 days"
          echo "   - Release artifacts: 90 days or more"
          echo "   - Default: 90 days"
          echo "   - Maximum: 400 days (Enterprise)"
          echo ""
          echo "3. Size limits:"
          echo "   - Per workflow run: 10 GB"
          echo "   - Individual file: 5 GB"
          echo ""
          echo "4. Downloading artifacts:"
          echo "   - Via GitHub UI"
          echo "   - Via GitHub CLI: gh run download"
          echo "   - Via REST API"
          echo "   - In workflow: actions/download-artifact"
          
      - name: Removing artifacts programmatically
        run: |
          echo "=== Removing Artifacts ==="
          echo ""
          echo "Using GitHub CLI:"
          echo "  gh api repos/:owner/:repo/actions/artifacts/:artifact_id \\"
          echo "    -X DELETE"
          echo ""
          echo "Using REST API:"
          echo "  DELETE /repos/{owner}/{repo}/actions/artifacts/{artifact_id}"
          echo ""
          echo "Artifacts are automatically deleted after retention period"

  status-badge-info:
    name: Status Badge Information
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate status badge markdown
        run: |
          echo "=== Status Badge Examples ==="
          echo ""
          echo "Basic workflow status badge:"
          echo "![Workflow Status](https://github.com/${{ github.repository }}/actions/workflows/17-artifacts.yml/badge.svg)"
          echo ""
          echo "Badge for specific branch:"
          echo "![Main Branch](https://github.com/${{ github.repository }}/actions/workflows/17-artifacts.yml/badge.svg?branch=main)"
          echo ""
          echo "Badge for specific event:"
          echo "![Push Events](https://github.com/${{ github.repository }}/actions/workflows/17-artifacts.yml/badge.svg?event=push)"
          echo ""
          echo "Multiple variations:"
          echo "- Default: Shows status of last run"
          echo "- Success: Green badge"
          echo "- Failure: Red badge"
          echo "- In progress: Yellow badge"
          
      - name: Create README with badges
        run: |
          cat > STATUS-BADGES.md <<EOF
          # Status Badges
          
          ## Workflow Badges
          
          ![Event Triggers](https://github.com/${{ github.repository }}/workflows/01%20-%20Event%20Triggers/badge.svg)
          ![Scheduled Events](https://github.com/${{ github.repository }}/workflows/02%20-%20Scheduled/badge.svg)
          ![Manual Trigger](https://github.com/${{ github.repository }}/workflows/03%20-%20Manual/badge.svg)
          
          ## Custom Badges
          
          You can also use shields.io for custom badges:
          
          ![GitHub Actions](https://img.shields.io/badge/GitHub%20Actions-2088FF?style=for-the-badge&logo=github-actions&logoColor=white)
          ![Status: Active](https://img.shields.io/badge/Status-Active-success)
          ![Coverage](https://img.shields.io/badge/Coverage-95%25-brightgreen)
          
          ## Adding Badges to README
          
          \`\`\`markdown
          ![CI](https://github.com/USER/REPO/workflows/CI/badge.svg)
          ![CD](https://github.com/USER/REPO/workflows/CD/badge.svg?branch=main)
          \`\`\`
          EOF
          cat STATUS-BADGES.md
          
      - name: Upload badge documentation
        uses: actions/upload-artifact@v4
        with:
          name: status-badges-doc
          path: STATUS-BADGES.md

  environment-protection:
    name: Environment with Protection Rules
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://example.com
    steps:
      - name: Environment information
        run: |
          echo "=== Environment Protection ==="
          echo "Deploying to: production"
          echo "Environment URL: https://example.com"
          echo ""
          echo "Protection rules can include:"
          echo "- Required reviewers"
          echo "- Wait timer"
          echo "- Deployment branches"
          echo "- Environment secrets"
          
      - name: Deploy to protected environment
        run: |
          echo "Deployment to production environment"
          echo "This job may require approval if configured"

  multi-environment-workflow:
    name: Multi-Environment Deployment
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [development, staging]
    environment:
      name: ${{ matrix.environment }}
      url: https://${{ matrix.environment }}.example.com
    steps:
      - name: Deploy to ${{ matrix.environment }}
        run: |
          echo "Deploying to ${{ matrix.environment }}"
          echo "URL: https://${{ matrix.environment }}.example.com"

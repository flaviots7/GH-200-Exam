# Domain 1: Author and maintain workflows (40%)
# Topic: Identify scenarios suited for using GitHub-hosted and self-hosted runners

name: 09 - Runners - GitHub-hosted vs Self-hosted

on:
  workflow_dispatch:
    inputs:
      runner-type:
        description: 'Runner type to use'
        type: choice
        options:
          - github-hosted
          - self-hosted
        default: 'github-hosted'

jobs:
  # GitHub-hosted runners
  ubuntu-runner:
    name: GitHub-hosted Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Runner information
        run: |
          echo "=== GitHub-hosted Ubuntu Runner ==="
          echo "OS: $(uname -s)"
          echo "Kernel: $(uname -r)"
          echo "Architecture: $(uname -m)"
          echo "CPU Cores: $(nproc)"
          echo "Memory: $(free -h | grep Mem | awk '{print $2}')"
          echo "Disk Space: $(df -h / | tail -1 | awk '{print $2}')"
          
      - name: Benefits of GitHub-hosted runners
        run: |
          echo "✓ No maintenance required"
          echo "✓ Clean environment for each job"
          echo "✓ Pre-installed tools and software"
          echo "✓ Automatic scaling"
          echo "✓ Included in GitHub Actions minutes"

  windows-runner:
    name: GitHub-hosted Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Runner information
        run: |
          echo "=== GitHub-hosted Windows Runner ==="
          systeminfo | findstr /B /C:"OS Name" /C:"OS Version"
          echo "Architecture: $env:PROCESSOR_ARCHITECTURE"
          
  macos-runner:
    name: GitHub-hosted macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Runner information
        run: |
          echo "=== GitHub-hosted macOS Runner ==="
          sw_vers
          sysctl -n machdep.cpu.brand_string
          
  # Self-hosted runner (will only run if you have one configured)
  self-hosted-runner:
    name: Self-hosted Runner
    # Labels to target self-hosted runners
    runs-on: [self-hosted, linux, x64]
    # Only run if explicitly selected
    if: inputs.runner-type == 'self-hosted'
    steps:
      - uses: actions/checkout@v4
      
      - name: Runner information
        run: |
          echo "=== Self-hosted Runner ==="
          echo "Runner name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          uname -a
          
      - name: Benefits of self-hosted runners
        run: |
          echo "✓ Custom hardware/software configuration"
          echo "✓ Access to internal resources"
          echo "✓ No minute limits"
          echo "✓ Persistent state between jobs (if needed)"
          echo "✓ Control over environment"
          
      - name: Use cases for self-hosted runners
        run: |
          echo "Use self-hosted runners for:"
          echo "- Large resource requirements"
          echo "- Specialized hardware (GPU, etc.)"
          echo "- Internal network access"
          echo "- Proprietary software/tools"
          echo "- Compliance requirements"
          echo "- Cost optimization for heavy usage"

  runner-labels:
    name: Using Runner Labels
    runs-on: ubuntu-latest
    steps:
      - name: Demonstrate runner label usage
        run: |
          echo "=== Runner Labels ==="
          echo "GitHub-hosted runner labels:"
          echo "- ubuntu-latest, ubuntu-22.04, ubuntu-20.04"
          echo "- windows-latest, windows-2022, windows-2019"
          echo "- macos-latest, macos-13, macos-12"
          echo ""
          echo "Self-hosted runner labels:"
          echo "- Custom labels you define"
          echo "- Example: [self-hosted, linux, x64, gpu]"
          echo "- Example: [self-hosted, production, high-memory]"
          
      - name: Runner selection best practices
        run: |
          echo "=== Best Practices ==="
          echo "1. Use GitHub-hosted for:"
          echo "   - Standard CI/CD workflows"
          echo "   - Public repositories"
          echo "   - Isolated builds"
          echo ""
          echo "2. Use self-hosted for:"
          echo "   - Enterprise environments"
          echo "   - Heavy computational tasks"
          echo "   - Internal dependencies"
          echo "   - Compliance requirements"
          echo ""
          echo "3. Security considerations:"
          echo "   - Never use self-hosted runners for public repos"
          echo "   - Implement proper access controls"
          echo "   - Regular security updates"

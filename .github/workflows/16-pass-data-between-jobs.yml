# Domain 2: Consume workflows (20%)
# Topic: Identify steps to pass data between jobs in a workflow

name: 16 - Pass Data Between Jobs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Job 1: Generate data and outputs
  generate-data:
    name: Generate Data
    runs-on: ubuntu-latest
    outputs:
      # Define outputs that other jobs can access
      version: ${{ steps.set-version.outputs.version }}
      build-time: ${{ steps.set-time.outputs.time }}
      artifact-name: ${{ steps.set-artifact.outputs.name }}
      matrix-data: ${{ steps.set-matrix.outputs.environments }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set version output
        id: set-version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"
          
      - name: Set timestamp output
        id: set-time
        run: |
          TIME=$(date +%Y%m%d-%H%M%S)
          echo "time=$TIME" >> $GITHUB_OUTPUT
          echo "Build time: $TIME"
          
      - name: Set artifact name output
        id: set-artifact
        run: |
          NAME="build-${{ github.run_number }}"
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "Artifact name: $NAME"
          
      - name: Generate matrix data
        id: set-matrix
        run: |
          # JSON array for matrix strategy
          ENVS='["dev", "staging", "prod"]'
          echo "environments=$ENVS" >> $GITHUB_OUTPUT
          echo "Matrix environments: $ENVS"
          
      - name: Create data files for artifact
        run: |
          mkdir -p data
          echo "Version: ${{ steps.set-version.outputs.version }}" > data/info.txt
          echo "Build Time: ${{ steps.set-time.outputs.time }}" >> data/info.txt
          echo "Commit: ${{ github.sha }}" >> data/info.txt
          
          # Create JSON data file
          cat > data/metadata.json <<EOF
          {
            "version": "${{ steps.set-version.outputs.version }}",
            "buildTime": "${{ steps.set-time.outputs.time }}",
            "commit": "${{ github.sha }}",
            "repository": "${{ github.repository }}"
          }
          EOF
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact.outputs.name }}
          path: data/
          retention-days: 7

  # Job 2: Use outputs from Job 1
  use-outputs:
    name: Use Job Outputs
    needs: generate-data
    runs-on: ubuntu-latest
    steps:
      - name: Display outputs from previous job
        run: |
          echo "=== Outputs from generate-data job ==="
          echo "Version: ${{ needs.generate-data.outputs.version }}"
          echo "Build Time: ${{ needs.generate-data.outputs.build-time }}"
          echo "Artifact Name: ${{ needs.generate-data.outputs.artifact-name }}"
          
      - name: Use outputs in conditions
        if: startsWith(needs.generate-data.outputs.version, '1.0')
        run: |
          echo "Version starts with 1.0"

  # Job 3: Download and use artifact
  use-artifact:
    name: Use Artifact Data
    needs: generate-data
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.generate-data.outputs.artifact-name }}
          path: ./downloaded-data
          
      - name: Display artifact contents
        run: |
          echo "=== Artifact Contents ==="
          cat ./downloaded-data/info.txt
          echo ""
          echo "=== Metadata JSON ==="
          cat ./downloaded-data/metadata.json
          
      - name: Process artifact data
        run: |
          # Extract version from JSON
          VERSION=$(cat ./downloaded-data/metadata.json | grep -o '"version": "[^"]*' | cut -d'"' -f4)
          echo "Extracted version: $VERSION"

  # Job 4: Multiple dependencies
  combine-data:
    name: Combine Data from Multiple Jobs
    needs: [generate-data, use-outputs, use-artifact]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.generate-data.outputs.artifact-name }}
          path: ./data
          
      - name: Combine all data
        run: |
          echo "=== Combined Data ==="
          echo "From outputs:"
          echo "  Version: ${{ needs.generate-data.outputs.version }}"
          echo "  Build Time: ${{ needs.generate-data.outputs.build-time }}"
          echo ""
          echo "From artifact:"
          cat ./data/info.txt

  # Job 5: Matrix job using output data
  deploy-matrix:
    name: Deploy to ${{ matrix.environment }}
    needs: generate-data
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Use output from previous job as matrix input
        environment: ${{ fromJSON(needs.generate-data.outputs.matrix-data) }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.generate-data.outputs.artifact-name }}
          path: ./build
          
      - name: Deploy to environment
        run: |
          echo "Deploying version ${{ needs.generate-data.outputs.version }}"
          echo "To environment: ${{ matrix.environment }}"
          echo "Build metadata:"
          cat ./build/metadata.json

  # Job 6: Demonstrate file-based data passing
  file-based-data:
    name: File-Based Data Passing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate large dataset
        run: |
          mkdir -p output
          # Create multiple files
          for i in {1..5}; do
            echo "Data set $i" > output/dataset-$i.txt
            echo "Generated at $(date)" >> output/dataset-$i.txt
          done
          
          # Create a summary report
          cat > output/report.md <<EOF
          # Build Report
          
          - Total files: 5
          - Generated: $(date)
          - Run number: ${{ github.run_number }}
          EOF
          
      - name: Upload multiple files
        uses: actions/upload-artifact@v4
        with:
          name: large-dataset
          path: output/**/*

  # Job 7: Use file-based data
  use-file-data:
    name: Use File-Based Data
    needs: file-based-data
    runs-on: ubuntu-latest
    steps:
      - name: Download dataset
        uses: actions/download-artifact@v4
        with:
          name: large-dataset
          path: ./datasets
          
      - name: Process datasets
        run: |
          echo "=== Processing Datasets ==="
          for file in ./datasets/dataset-*.txt; do
            echo "Processing: $(basename $file)"
            cat $file
            echo "---"
          done
          
          echo ""
          echo "=== Report ==="
          cat ./datasets/report.md

  # Job 8: Summary of data passing methods
  data-passing-summary:
    name: Data Passing Summary
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Data passing methods
        run: |
          echo "=== Methods to Pass Data Between Jobs ==="
          echo ""
          echo "1. Job Outputs (GITHUB_OUTPUT)"
          echo "   - Best for: Small strings, numbers, JSON"
          echo "   - Limit: 1 MB per output"
          echo "   - Usage: needs.job-id.outputs.output-name"
          echo ""
          echo "2. Artifacts (upload/download-artifact)"
          echo "   - Best for: Files, build outputs, large data"
          echo "   - Limit: 10 GB per workflow run"
          echo "   - Retention: Configurable (default 90 days)"
          echo ""
          echo "3. Cache (actions/cache)"
          echo "   - Best for: Dependencies that rarely change"
          echo "   - Limit: 10 GB per repository"
          echo "   - Retention: 7 days for unused caches"
          echo ""
          echo "4. Environment Variables (GITHUB_ENV)"
          echo "   - Scope: Within the same job only"
          echo "   - Cannot pass between jobs"
          echo ""
          echo "5. Step Outputs"
          echo "   - Scope: Within the same job only"
          echo "   - Usage: steps.step-id.outputs.output-name"

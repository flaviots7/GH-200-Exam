# Domain 1: Author and maintain workflows (40%)
# Topic: Use the components of a workflow - Demonstrate the use of dependent jobs

name: 07 - Workflow Components - Dependent Jobs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Job 1: Build (runs first, no dependencies)
  build:
    name: Build Application
    runs-on: ubuntu-latest
    outputs:
      # Define outputs that other jobs can use
      version: ${{ steps.version.outputs.version }}
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate version
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION"
          
      - name: Build application
        run: |
          echo "Building application..."
          mkdir -p dist
          echo "Application v${{ steps.version.outputs.version }}" > dist/app.txt
          echo "Built at $(date)" >> dist/app.txt
          
      - name: Set artifact name
        id: artifact
        run: |
          ARTIFACT_NAME="app-${{ steps.version.outputs.version }}"
          echo "name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/

  # Job 2: Unit Tests (runs after build completes)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build  # This job depends on 'build' job
    steps:
      - uses: actions/checkout@v4
      
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/
          
      - name: Display build version
        run: |
          echo "Testing version: ${{ needs.build.outputs.version }}"
          cat dist/app.txt
          
      - name: Run unit tests
        run: |
          echo "Running unit tests..."
          sleep 2
          echo "✓ All unit tests passed"

  # Job 3: Integration Tests (runs after build completes)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build  # Also depends on 'build' job (runs in parallel with unit-tests)
    steps:
      - uses: actions/checkout@v4
      
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/
          
      - name: Run integration tests
        run: |
          echo "Running integration tests for v${{ needs.build.outputs.version }}..."
          sleep 3
          echo "✓ All integration tests passed"

  # Job 4: Security Scan (depends on build)
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Run security scan
        run: |
          echo "Running security scan..."
          sleep 2
          echo "✓ No vulnerabilities found"

  # Job 5: Deploy to Staging (depends on ALL test jobs completing successfully)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # This job depends on multiple jobs - ALL must succeed
    needs: [build, unit-tests, integration-tests, security-scan]
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/
          
      - name: Deploy to staging
        run: |
          echo "Deploying version ${{ needs.build.outputs.version }} to staging..."
          cat dist/app.txt
          sleep 2
          echo "✓ Deployed to staging successfully"

  # Job 6: Smoke Tests (depends on staging deployment)
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Run smoke tests
        run: |
          echo "Running smoke tests on staging..."
          sleep 2
          echo "✓ Smoke tests passed"

  # Job 7: Deploy to Production (depends on smoke tests)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging, smoke-tests, build]
    # Only deploy to production from main branch
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://production.example.com
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/
          
      - name: Deploy to production
        run: |
          echo "Deploying version ${{ needs.build.outputs.version }} to production..."
          cat dist/app.txt
          sleep 3
          echo "✓ Deployed to production successfully"
          
      - name: Notify team
        run: |
          echo "📢 Version ${{ needs.build.outputs.version }} is now live in production!"

  # Job 8: Cleanup (always runs at the end, even if previous jobs fail)
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()  # Run even if previous jobs failed
    steps:
      - name: Cleanup resources
        run: |
          echo "Cleaning up temporary resources..."
          echo "Workflow run #${{ github.run_number }} cleanup complete"

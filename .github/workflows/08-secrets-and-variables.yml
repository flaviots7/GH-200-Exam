# Domain 1: Author and maintain workflows (40%)
# Topic: Use encrypted secrets and environment variables as part of a workflow

name: 08 - Secrets and Environment Variables

on:
  push:
    branches: [main]
  workflow_dispatch:

# Workflow-level environment variables
env:
  WORKFLOW_ENV: "production"
  BUILD_NUMBER: ${{ github.run_number }}
  
jobs:
  environment-variables:
    name: Environment Variables Demo
    runs-on: ubuntu-latest
    # Job-level environment variables
    env:
      JOB_ENV: "job-level-value"
      API_URL: "https://api.example.com"
    steps:
      - uses: actions/checkout@v4
      
      - name: Display default environment variables
        run: |
          echo "=== Default GitHub Environment Variables ==="
          echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
          echo "GITHUB_WORKFLOW: $GITHUB_WORKFLOW"
          echo "GITHUB_RUN_ID: $GITHUB_RUN_ID"
          echo "GITHUB_RUN_NUMBER: $GITHUB_RUN_NUMBER"
          echo "GITHUB_ACTION: $GITHUB_ACTION"
          echo "GITHUB_ACTOR: $GITHUB_ACTOR"
          echo "GITHUB_REF: $GITHUB_REF"
          echo "GITHUB_REF_NAME: $GITHUB_REF_NAME"
          echo "GITHUB_SHA: $GITHUB_SHA"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "RUNNER_OS: $RUNNER_OS"
          echo "RUNNER_ARCH: $RUNNER_ARCH"
          echo "RUNNER_NAME: $RUNNER_NAME"
          
      - name: Display custom environment variables
        env:
          STEP_ENV: "step-level-value"
        run: |
          echo "=== Custom Environment Variables ==="
          echo "WORKFLOW_ENV: $WORKFLOW_ENV"
          echo "JOB_ENV: $JOB_ENV"
          echo "STEP_ENV: $STEP_ENV"
          echo "BUILD_NUMBER: $BUILD_NUMBER"
          echo "API_URL: $API_URL"
          
      - name: Set environment variable using workflow command
        run: |
          echo "Setting dynamic environment variable..."
          echo "DYNAMIC_VAR=value-set-at-runtime-${{ github.run_number }}" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV
          
      - name: Use dynamically set environment variable
        run: |
          echo "DYNAMIC_VAR: $DYNAMIC_VAR"
          echo "TIMESTAMP: $TIMESTAMP"
          
      - name: Multi-line environment variable
        run: |
          echo "MULTILINE_VAR<<EOF" >> $GITHUB_ENV
          echo "Line 1 of content" >> $GITHUB_ENV
          echo "Line 2 of content" >> $GITHUB_ENV
          echo "Line 3 of content" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
      - name: Display multi-line variable
        run: |
          echo "Multi-line variable:"
          echo "$MULTILINE_VAR"

  secrets-usage:
    name: Secrets Usage Demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Using secrets (conceptual example)
        run: |
          echo "=== Using Secrets ==="
          echo "Secrets are accessed via secrets context"
          echo "Example: \${{ secrets.MY_SECRET }}"
          echo ""
          echo "⚠️ NEVER echo actual secret values!"
          echo "⚠️ Secrets are automatically masked in logs"
          
      - name: Checking if secret exists
        run: |
          # You can check if a secret is set without revealing its value
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "Docker username secret is set"
          else
            echo "Docker username secret is not set"
          fi
          
      - name: Using GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== GITHUB_TOKEN Usage ==="
          echo "GITHUB_TOKEN is automatically available in all workflows"
          echo "It's used for authenticated GitHub API calls"
          echo "Token permissions are scoped to the repository"
          echo ""
          echo "Common uses:"
          echo "- Creating releases"
          echo "- Commenting on issues/PRs"
          echo "- Pushing to repository"
          echo "- Accessing GitHub API"
          
      # Example: Using GITHUB_TOKEN to create a comment (conceptual)
      - name: Example API call with GITHUB_TOKEN
        run: |
          echo "Example: Fetching repository information"
          # Uncomment to actually make API call:
          # curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          #      https://api.github.com/repos/${{ github.repository }}

  environment-secrets:
    name: Environment-Specific Secrets
    runs-on: ubuntu-latest
    environment: development  # Environment-specific secrets
    steps:
      - name: Using environment secrets
        run: |
          echo "=== Environment-Specific Configuration ==="
          echo "This job runs in the 'development' environment"
          echo "Environment-specific secrets are available here:"
          echo "- \${{ secrets.ENV_SPECIFIC_SECRET }}"
          echo "- \${{ secrets.DATABASE_URL }}"
          echo ""
          echo "These secrets are scoped to the 'development' environment"

  workflow-commands:
    name: Workflow Commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set output using workflow command
        id: set-output
        run: |
          echo "Setting output values..."
          echo "output-key=output-value" >> $GITHUB_OUTPUT
          echo "version=1.2.3" >> $GITHUB_OUTPUT
          
      - name: Use step output
        run: |
          echo "Output from previous step: ${{ steps.set-output.outputs.output-key }}"
          echo "Version: ${{ steps.set-output.outputs.version }}"
          
      - name: Add a system path
        run: |
          mkdir -p $HOME/custom-bin
          echo "$HOME/custom-bin" >> $GITHUB_PATH
          
      - name: Masking a value in logs
        run: |
          SENSITIVE_VALUE="my-sensitive-value-123"
          echo "::add-mask::$SENSITIVE_VALUE"
          echo "This value is now masked: $SENSITIVE_VALUE"
          
      - name: Group commands in log
        run: |
          echo "::group::My Group Title"
          echo "This is inside a collapsible group"
          echo "Multiple lines here"
          echo "::endgroup::"
          
      - name: Set warning message
        run: |
          echo "::warning file=app.js,line=10,col=5::This is a warning message"
          
      - name: Set error message
        run: |
          echo "::error file=app.js,line=15::This is an error message"
          
      - name: Set notice message
        run: |
          echo "::notice file=app.js,line=20::This is a notice message"

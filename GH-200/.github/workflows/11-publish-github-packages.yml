# Domain 1: Author and maintain workflows (40%)
# Topic: Demonstrate how to publish to GitHub Packages using a workflow

name: 11 - Publish to GitHub Packages

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-npm-package:
    name: Publish NPM Package to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'
          
      - name: Configure package.json for GitHub Packages
        run: |
          # Update package.json to point to GitHub Packages registry
          cat > package.json <<EOF
          {
            "name": "@${{ github.repository_owner }}/gh200-exam-app",
            "version": "1.0.${{ github.run_number }}",
            "description": "Sample package for GitHub Actions certification",
            "main": "index.js",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/${{ github.repository }}.git"
            },
            "publishConfig": {
              "registry": "https://npm.pkg.github.com"
            }
          }
          EOF
          
      - name: Create package files
        run: |
          cat > index.js <<EOF
          module.exports = {
            greet: function(name) {
              return \`Hello, \${name}! This is from GitHub Packages.\`;
            },
            version: '1.0.${{ github.run_number }}'
          };
          EOF
          
          cat > README.md <<EOF
          # GH-200 Exam Sample Package
          
          Published to GitHub Packages as part of GitHub Actions certification preparation.
          
          Version: 1.0.${{ github.run_number }}
          Built: $(date)
          EOF
          
      - name: Install dependencies
        run: npm install
        
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-maven-package:
    name: Publish Maven Package to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Create Maven project structure
        run: |
          mkdir -p src/main/java/com/example
          
          # Create pom.xml
          cat > pom.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0
                   http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            
            <groupId>com.example</groupId>
            <artifactId>gh200-exam-artifact</artifactId>
            <version>1.0.${{ github.run_number }}</version>
            <packaging>jar</packaging>
            
            <name>GH-200 Exam Artifact</name>
            <description>Sample Maven package for GitHub Actions certification</description>
            
            <distributionManagement>
              <repository>
                <id>github</id>
                <name>GitHub Packages</name>
                <url>https://maven.pkg.github.com/${{ github.repository }}</url>
              </repository>
            </distributionManagement>
          </project>
          EOF
          
          # Create a simple Java class
          cat > src/main/java/com/example/App.java <<EOF
          package com.example;
          
          public class App {
              public static String getGreeting() {
                  return "Hello from GitHub Packages!";
              }
          }
          EOF
          
      - name: Build with Maven
        run: mvn clean package
        
      - name: Publish to GitHub Packages
        run: mvn deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker-package:
    name: Publish Docker Package to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            
      - name: Create Dockerfile
        run: |
          cat > Dockerfile <<EOF
          FROM node:20-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm install --production
          COPY . .
          EXPOSE 3000
          CMD ["node", "index.js"]
          EOF
          
          cat > index.js <<EOF
          const http = require('http');
          const server = http.createServer((req, res) => {
            res.writeHead(200, {'Content-Type': 'text/plain'});
            res.end('Hello from GitHub Packages Docker image!');
          });
          server.listen(3000, () => {
            console.log('Server running on port 3000');
          });
          EOF
          
          cat > package.json <<EOF
          {
            "name": "gh200-docker-app",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-nuget-package:
    name: Publish NuGet Package to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Create NuGet package
        run: |
          dotnet new classlib -n GH200ExamLib -o .
          dotnet pack -c Release /p:Version=1.0.${{ github.run_number }}
          
      - name: Publish to GitHub Packages
        run: |
          dotnet nuget add source --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          dotnet nuget push "bin/Release/*.nupkg" --source "github" --skip-duplicate

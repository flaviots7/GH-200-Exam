# Domain 1: Author and maintain workflows (40%)
# Topic: Use CodeQL as a step in a workflow

name: 12 - CodeQL Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run CodeQL analysis weekly on Monday at 6:00 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      # Required for CodeQL
      actions: read
      contents: read
      security-events: write
      
    strategy:
      fail-fast: false
      matrix:
        # Analyze multiple languages if needed
        language: ['javascript', 'python']
        # CodeQL supports: 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby'
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Optionally specify CodeQL query suites
          # queries: security-extended,security-and-quality
          
          # Custom queries can be added
          # queries: ./custom-queries
          
          # You can also specify config file
          # config-file: ./.github/codeql/codeql-config.yml
          
      - name: Display CodeQL information
        run: |
          echo "Running CodeQL analysis for: ${{ matrix.language }}"
          echo "This will scan for security vulnerabilities and code quality issues"
          
      # For compiled languages (Java, C#, C++, Go), you need to build
      # - name: Build project
      #   run: |
      #     make build
          
      # Autobuild attempts to build any compiled languages
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
        
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          # Upload results to GitHub Security tab
          upload: true

  codeql-with-custom-config:
    name: CodeQL with Custom Configuration
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Create CodeQL config file
        run: |
          mkdir -p .github/codeql
          cat > .github/codeql/codeql-config.yml <<EOF
          name: "Custom CodeQL Configuration"
          
          # Disable default queries
          disable-default-queries: false
          
          # Specify which query suites to run
          queries:
            - uses: security-extended
            - uses: security-and-quality
          
          # Paths to include in analysis
          paths:
            - src
            - lib
          
          # Paths to ignore
          paths-ignore:
            - node_modules
            - test
            - '**/*.test.js'
          
          # Query filters
          query-filters:
            - exclude:
                id: js/useless-assignment-to-local
          EOF
          
      - name: Initialize CodeQL with config
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          config-file: .github/codeql/codeql-config.yml
          
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
        
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  codeql-sarif-upload:
    name: CodeQL SARIF Upload Example
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
        
      - name: Perform CodeQL Analysis and save SARIF
        uses: github/codeql-action/analyze@v3
        with:
          output: results
          upload: false
          
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results/javascript.sarif
          category: custom-analysis
          
      - name: Upload SARIF as artifact (for review)
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-results
          path: results/*.sarif

  third-party-security-scanning:
    name: Additional Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Display security scanning info
        run: |
          echo "=== Security Scanning Best Practices ==="
          echo ""
          echo "1. CodeQL - For source code analysis"
          echo "   - Finds security vulnerabilities"
          echo "   - Detects code quality issues"
          echo "   - Supports multiple languages"
          echo ""
          echo "2. Dependency scanning"
          echo "   - Checks for vulnerable dependencies"
          echo "   - Available in GitHub Security tab"
          echo "   - Automated Dependabot alerts"
          echo ""
          echo "3. Secret scanning"
          echo "   - Detects committed secrets"
          echo "   - Push protection available"
          echo "   - Partner patterns included"
          echo ""
          echo "4. Container scanning"
          echo "   - Scans Docker images"
          echo "   - Identifies base image vulnerabilities"
          echo "   - Integration with registries"

# Domain 2: Consume workflows (20%)
# Topic: Reusable workflows and templates

name: 19 - Reusable Workflow (Called)

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: string
      version:
        description: 'Version to deploy'
        required: false
        type: string
        default: 'latest'
      dry-run:
        description: 'Perform dry run only'
        required: false
        type: boolean
        default: false
    outputs:
      deployment-url:
        description: 'URL of the deployed application'
        value: ${{ jobs.deploy.outputs.url }}
      deployment-status:
        description: 'Status of the deployment'
        value: ${{ jobs.deploy.outputs.status }}
    secrets:
      deploy-token:
        description: 'Deployment token'
        required: true

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      status: ${{ steps.deploy.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate inputs
        run: |
          echo "=== Deployment Configuration ==="
          echo "Environment: ${{ inputs.environment }}"
          echo "Version: ${{ inputs.version }}"
          echo "Dry run: ${{ inputs.dry-run }}"
          echo "Token provided: ${{ secrets.deploy-token != '' }}"
          
      - name: Prepare deployment
        run: |
          echo "Preparing deployment package..."
          mkdir -p dist
          echo "App version: ${{ inputs.version }}" > dist/version.txt
          echo "Environment: ${{ inputs.environment }}" >> dist/version.txt
          
      - name: Deploy application
        id: deploy
        run: |
          if [ "${{ inputs.dry-run }}" == "true" ]; then
            echo "🔍 DRY RUN MODE - No actual deployment"
            echo "Would deploy to: ${{ inputs.environment }}"
          else
            echo "🚀 Deploying to ${{ inputs.environment }}..."
            sleep 2
            echo "✅ Deployment successful"
          fi
          
          # Set outputs
          URL="https://${{ inputs.environment }}.example.com"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
          
      - name: Verify deployment
        if: inputs.dry-run == false
        run: |
          echo "Verifying deployment at ${{ steps.deploy.outputs.url }}"
          echo "✓ Health check passed"
          echo "✓ Application responding"

  post-deployment:
    name: Post-deployment tasks
    runs-on: ubuntu-latest
    needs: deploy
    if: inputs.dry-run == false
    steps:
      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          echo "Testing: ${{ needs.deploy.outputs.url }}"
          echo "✓ All smoke tests passed"
          
      - name: Send notification
        run: |
          echo "📢 Deployment notification"
          echo "Environment: ${{ inputs.environment }}"
          echo "Version: ${{ inputs.version }}"
          echo "URL: ${{ needs.deploy.outputs.url }}"
          echo "Status: ${{ needs.deploy.outputs.status }}"

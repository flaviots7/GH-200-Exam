name: 'Docker Container Action'
description: 'A sample Docker container action for GH-200 exam preparation'
author: 'GH-200 Student'

# Define inputs
inputs:
  task:
    description: 'Task to perform'
    required: true
    default: 'analyze'
  target:
    description: 'Target file or directory'
    required: false
    default: '.'
  verbose:
    description: 'Enable verbose output'
    required: false
    default: 'false'

# Define outputs
outputs:
  result:
    description: 'Result of the analysis'
  exit-code:
    description: 'Exit code of the operation'

# Specify that this is a Docker container action
runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.task }}
    - ${{ inputs.target }}
    - ${{ inputs.verbose }}

# Branding
branding:
  icon: 'box'
  color: 'green'
